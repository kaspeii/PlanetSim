[package]
name = "PlanetSim"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
bevy_egui = "0.41.1"
noise = "0.9"
rand = "0.10.3"
futures-lite = "2.6.1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 0
debug = "line-tables-only"