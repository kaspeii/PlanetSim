# .cargo/config.toml
# Кроссплатформенная конфигурация быстрой линковки для Bevy (без локальных путей)

[target.x86_64-pc-windows-msvc]
# rustup автоматически добавляет прокси rust-lld.exe в ~/.cargo/bin,
# поэтому указывать полный путь к папке пользователя не нужно.
linker = "rust-lld.exe"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]